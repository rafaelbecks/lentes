<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LENTE pipeline smoke</title>
  </head>
  <body>
    <canvas id="output"></canvas>
    <p id="result">running</p>
    <script type="module">
      import { createRenderer } from '../src/renderer/renderer.js'
      import { createDefaultProject } from '../src/projects/schema.js'
      import { EFFECT_DEFINITIONS } from '../src/effects/registry.js'
      import { PROCEDURAL_IDS } from '../src/sources/procedural/index.js'

      const result = document.querySelector('#result')

      function pixel (gl, x, y) {
        const data = new Uint8Array(4)
        gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, data)
        return `${data[0]},${data[1]},${data[2]}`
      }

      try {
        const paint = document.createElement('canvas')
        paint.width = 64
        paint.height = 64
        const ctx = paint.getContext('2d')
        ctx.fillStyle = '#ff0000'
        ctx.fillRect(0, 0, 64, 32)
        ctx.fillStyle = '#0000ff'
        ctx.fillRect(0, 32, 64, 32)
        const video = document.createElement('video')
        video.muted = true
        video.playsInline = true
        video.srcObject = paint.captureStream(30)
        await video.play()
        const started = performance.now()
        while (video.readyState < 2 || !video.videoWidth) {
          if (performance.now() - started > 2000) throw new Error('test video never produced a frame')
          await new Promise((resolve) => requestAnimationFrame(resolve))
        }

        const canvas = document.querySelector('#output')
        const renderer = createRenderer(canvas)
        const gl = renderer.gl
        const state = createDefaultProject()
        state.output.width = 128
        state.output.height = 128
        const sources = [{ video, live: true }, { video: null, live: false }, { video: null, live: false }]
        let time = 0
        const draw = () => renderer.render({ sources, state, time: (time += 1 / 30) })
        const out = {}
        const input = state.inputs[0]
        const effect = (id) => state.effects.find((entry) => entry.id === id)

        draw()
        out.top = pixel(gl, 64, 120)
        out.bottom = pixel(gl, 64, 8)

        input.invert = true
        draw()
        out.inverted = pixel(gl, 64, 120)
        input.invert = false
        input.flipY = true
        draw()
        out.flipped = pixel(gl, 64, 120)
        input.flipY = false
        state.mixer.mutes[0] = true
        draw()
        out.muted = pixel(gl, 64, 120)
        state.mixer.mutes[0] = false

        effect('color').params.brightness = 0
        draw()
        out.dark = pixel(gl, 64, 120)
        effect('color').params.brightness = 100

        const mask = effect('mask')
        mask.enabled = true
        mask.params.centerY = 0.25
        mask.params.size = 0.3
        draw()
        out.maskInside = pixel(gl, 64, 96)
        out.maskOutside = pixel(gl, 2, 126)
        mask.params.outside = 'color'
        mask.params.color = '#00ff00'
        draw()
        out.maskColor = pixel(gl, 2, 126)
        mask.enabled = false

        const dither = effect('dither')
        dither.enabled = true
        dither.params.mapSize = 2
        dither.params.scale = 1
        draw()
        out.dither = pixel(gl, 64, 120)
        dither.enabled = false

        const errors = []
        for (const definition of EFFECT_DEFINITIONS) {
          for (const entry of state.effects) entry.enabled = entry.id === definition.id
          draw()
          const code = gl.getError()
          if (code !== gl.NO_ERROR) errors.push(`${definition.id}:${code}`)
        }
        for (const entry of state.effects) entry.enabled = true
        draw()
        if (gl.getError() !== gl.NO_ERROR) errors.push('all-effects')
        for (const entry of state.effects) entry.enabled = entry.id === 'color'

        state.mixer.mode = 'solo'
        state.mixer.solo = 1
        state.inputs[1].kind = 'shader'
        const shaders = []
        for (const id of PROCEDURAL_IDS) {
          state.inputs[1].shader = id
          draw()
          draw()
          const code = gl.getError()
          if (code !== gl.NO_ERROR) errors.push(`${id}:${code}`)
          const samples = [pixel(gl, 32, 32), pixel(gl, 64, 64), pixel(gl, 96, 96), pixel(gl, 20, 100)]
          const lit = samples.some((value) => value !== '0,0,0')
          shaders.push(`${id}:${lit ? 'lit' : 'black'}`)
        }

        Object.assign(result.dataset, out)
        result.dataset.shaders = shaders.join(' ')
        result.dataset.errors = errors.join(' ') || 'none'
        result.textContent = 'done'
      } catch (error) {
        result.dataset.error = error.message
        result.textContent = error.message
      }
    </script>
  </body>
</html>
