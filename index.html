<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LENTE</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23aef0b8' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <header class="chrome chrome-bar">
      <div id="app-menu"></div>
      <span class="wordmark">LENTE</span>
      <span id="project-name">Untitled</span>
      <span id="status"></span>
      <span id="fps"></span>
      <a class="studio" href="https://luminode.studio/" target="_blank" rel="noreferrer">luminode studio</a>
    </header>

    <div id="stage">
      <canvas id="output" aria-label="LENTE output"></canvas>
      <p id="hint">Connect a camera</p>
      <p id="boot" hidden></p>
    </div>

    <aside id="pane" class="chrome"></aside>
    <footer id="strips" class="chrome"></footer>

    <div id="modal" class="modal" hidden>
      <form>
        <h2 id="modal-title">LENTE</h2>
        <p id="modal-body"></p>
        <label id="modal-name-field">
          Name
          <input id="modal-name" name="name" autocomplete="off" />
        </label>
        <div id="modal-list" hidden></div>
        <div class="modal-actions">
          <button type="button" id="modal-cancel">Cancel</button>
          <button type="submit" id="modal-ok">OK</button>
        </div>
      </form>
    </div>

    <input id="file-fallback" type="file" accept=".lente,application/json" hidden />
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
